services:
  router:
    container_name: isaac-router
    image: nginx:1.28
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /local/data/dhparam.pem:/dhparam.pem
      - /local/data/certificates:/letsencrypt
      - /local/data/cdn:/var/cdn:ro
      - ./html:/usr/share/nginx/html
      - ./conf:/etc/nginx/conf:ro
    networks:
      - isaac
    restart: always

  loadbalancer:
    image: haproxy:3.4
    container_name: isaac-loadbalancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - isaac
      - isaacipv6
    restart: always 

networks:
  default:
  isaac:
    name: isaac
    external: true
  isaacipv6:
    name: isaacipv6
    external: true