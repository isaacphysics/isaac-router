global
  user haproxy
  stats socket /tmp/api.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
  log stdout format raw local0 info
  maxconn 500

defaults
  timeout client 30000
  timeout connect 5000
  timeout server 30000
  log global

frontend isaacfrontend
  mode tcp
  bind :80
  bind [::]:80
  bind :443
  bind [::]:443
  default_backend nginx

backend nginx
  mode tcp
  server passdown isaac-router send-proxy
  # TODO add routing to other machine's HAProxy & maintenance page
  # server passacross "$REMOTE_SERVER_IP" send-proxy backup
